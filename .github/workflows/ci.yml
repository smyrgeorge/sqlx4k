name: Build
permissions:
  contents: read

on:
  push:
    # Caches are saved by the runs on main: a cache written by a pull request is only visible to that
    # pull request, while one written on main is restored by every pull request.
    branches: [ main ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Linux: the build covers the JVM, Android and the host's native target (linuxX64). The Apple targets are
    # only built on a macOS host.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      # The build calls cargo from ~/.cargo/bin (the rustup location); the runner images do not guarantee it.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the Gradle user home (wrapper, dependencies, build cache). It is written on the default
      # branch only and restored everywhere else.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      # Caches the cargo registry and the target directories of the Rust crates, keyed on the rustc
      # version and the Cargo.lock files. The crates' own artifacts are dropped before saving, so they
      # are always rebuilt while their (expensive) dependencies are restored. The build only targets
      # the JVM and the host (linuxX64), so the toolchain needs no extra targets.
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sqlx4k-mysql/src/rust -> target
            sqlx4k-postgres/src/rust -> target
            sqlx4k-sqlite/src/rust -> target
            sqlx4k-sqlite-cipher/src/rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Kotlin/Native toolchain and its dependencies, which depend on the Kotlin version only.
      - name: Setup Kotlin/Native Cache
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Bootstrap sqlx4k Gradle plugin
        run: ./scripts/bootstrap.sh

      - name: Gradle Build
        run: ./gradlew build -x test -x jvmTest -x linuxX64Test -x testAndroid -x testAndroidHostTest
