[package]
name = "sqlx4k_sqlite"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1

[dependencies]
# https://crates.io/crates/once_cell
once_cell = { version = "1.21.4" }
# https://crates.io/crates/tokio
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "sync",   # mpsc/oneshot channels of the row streams (fetch).
    "macros", # tokio::select! in the row streams.
] }
# https://crates.io/crates/futures-core (already a sqlx dependency; the row stream type)
futures-core = "0.3"
# https://crates.io/crates/futures-util (already a sqlx dependency; TryStreamExt::try_next)
futures-util = "0.3"
# https://crates.io/crates/sqlx
sqlx = { version = "0.9.0", features = [
    "runtime-tokio", # Use the tokio runtime without enabling a TLS backend.
    "sqlite",        # Add support for the SQLite database server.
] }
# https://crates.io/crates/hex
hex = "0.4.3"

[build-dependencies]
# https://crates.io/crates/cbindgen
cbindgen = "0.29.2"
