[project]
site_name = "sqlx4k"
site_url = "https://smyrgeorge.github.io/sqlx4k/"
site_description = "A coroutine-first SQL toolkit with compile-time query validations for Kotlin Multiplatform."
site_author = "Yorgos S."

repo_url = "https://github.com/smyrgeorge/sqlx4k"
repo_name = "smyrgeorge/sqlx4k"
edit_uri = "edit/main/docs/"

copyright = "Released under the MIT License."

# The API reference is generated by Dokka and copied into the built site under api/ by the docs workflow
# (.github/workflows/docs.yml), so it is linked by its absolute URL.
nav = [
    { "Home" = "index.md" },
    { "Getting started" = [
        "getting-started/installation.md",
        "getting-started/gradle-plugin.md",
        "getting-started/examples.md",
    ] },
    { "Databases" = [
        "databases/postgresql.md",
        "databases/mysql.md",
        "databases/sqlite.md",
        "databases/sqlcipher.md",
    ] },
    { "Guide" = [
        "guide/index.md",
        "guide/connection-pool.md",
        "guide/queries.md",
        "guide/mapping.md",
        "guide/transactions.md",
        "guide/migrations.md",
    ] },
    { "Code generation" = [
        "codegen/index.md",
        "codegen/entities.md",
        "codegen/batch-operations.md",
        "codegen/context-parameters.md",
        "codegen/hooks.md",
        "codegen/validation.md",
        "codegen/in-memory-repositories.md",
    ] },
    { "Extensions" = [
        "extensions/pgmq.md",
        "extensions/sqldelight.md",
    ] },
    { "Supported targets" = "platforms.md" },
    { "Contributing" = [
        "contributing/building.md",
        "contributing/benchmarks.md",
        "contributing/roadmap.md",
    ] },
    { "Acknowledgements" = "acknowledgements.md" },
    { "API reference" = "https://smyrgeorge.github.io/sqlx4k/api/" },
]

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/smyrgeorge/sqlx4k"

[project.markdown_extensions]
abbr = { }
admonition = { }
attr_list = { }
def_list = { }
footnotes = { }
md_in_html = { }
tables = { }
toc.permalink = true
pymdownx.betterem = { }
pymdownx.details = { }
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = { }
pymdownx.keys = { }
pymdownx.magiclink = { }
pymdownx.mark = { }
pymdownx.smartsymbols = { }
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
